
name: Pipeline Hello World

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  say-hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher le message
        run: echo "Hello World"

  say-family-name:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher nom
        run: echo "${{ vars.NAME }}"

  say-first-name:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher prenom
        run: echo "${{ vars.PRENOM }}"

  say-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher mail
        run: echo "${{ vars.EMAIL }}"

  deploy:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lint:
    runs-on: ubutun-latest

    steps:
      - uses: actions/checkout@v4w

      - name: Vérifie code HTML
        run: npx --yes htmlhint helloworld.html

