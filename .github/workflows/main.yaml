name: Pipeline Hello World

on: [push]

jobs:
  say-hello-world:
    runs-on: ubuntu-latest 

    steps:
      - name: Afficher le message
        run: echo "Hello World"
    
  say-family-name:
    runs-on: ubuntu-latest

    steps: 
      - name: Afficher nom
        run: echo "${{vars.NAME}}"

  say-first-name:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher prenom
        run: echo "${{vars.PRENOM}}"
  
  say-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher mail
        run: echo "${{vars.EMAIL}}"

